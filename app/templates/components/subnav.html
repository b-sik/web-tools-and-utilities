{% if utility.subnav %}
<div class="subnav">
    <div class="container">
        <ul class="subnav-list">
            {% for item in utility.subnav %}
            <li class="subnav-item">
                <a href="#{{ item.anchor }}" class="subnav-link">{{ item.name }}</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endif %}
