<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Utilities</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="/" class="header-title">Web Utils</a>
            <nav class="nav">
                {% for utility in utilities %}
                <a href="{{ utility.path }}" class="nav-link {% if request.path.strip('/') == utility.path.strip('/') %}active{% endif %}">
                    <span class="nav-link-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="{{ utility.icon_path }}" />
                        </svg>
                    </span>
                    {{ utility.name }}
                </a>
                {% endfor %}
            </nav>
        </div>
    </header>
    {% block subnav %}{% endblock %}

    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">
                © {{ year }} Web Utilities. All rights reserved.
            </p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
