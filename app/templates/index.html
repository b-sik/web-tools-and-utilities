{% extends "base.html" %}

{% block content %}
<div class="grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; max-width: 1200px; margin: 0 auto;">
    {% for utility in utilities %}
    <div class="card">
        <h2 class="card-title">{{ utility.name }}</h2>
        <p class="card-description">{{ utility.description }}</p>
        <a href="{{ utility.path }}" class="btn btn-primary">Open {{ utility.name }}</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
