{% extends "base.html" %}

{% block content %}
<div class="grid-main" role="grid">
    {% for utility in utilities %}
    <div class="card" role="gridcell">
        <h2 class="card-title" id="utility-{{ utility.id }}">{{ utility.name }}</h2>
        <p class="card-description">{{ utility.description }}</p>
        <a 
            href="{{ utility.path }}" 
            class="btn btn-primary"
            aria-labelledby="utility-{{ utility.id }}"
            aria-describedby="desc-{{ utility.id }}"
        >Open {{ utility.name }}</a>
        <span id="desc-{{ utility.id }}" class="sr-only">Click to access {{ utility.name }} tools</span>
    </div>
    {% endfor %}
</div>
{% endblock %}
